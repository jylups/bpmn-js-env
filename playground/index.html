<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flowable BPMN playground</title>
</head>
<body>
  <header class="toolbar">
    <strong class="title">Flowable BPMN playground</strong>

    <label>
      Sample
      <select id="sample"></select>
    </label>

    <button type="button" id="new">New diagram</button>
    <button type="button" id="open">Open file…</button>
    <input type="file" id="file" accept=".bpmn,.bpmn20.xml,.xml" hidden>

    <div class="mode" role="group" aria-label="Mode">
      <button type="button" data-mode="viewer">Viewer</button>
      <button type="button" data-mode="modeler">Modeler</button>
    </div>

    <button type="button" id="download">Download XML</button>

    <span id="status" class="status" role="status"></span>
  </header>

  <main class="layout">
    <section class="canvas-area">
      <div id="canvas" class="canvas"></div>
      <aside id="properties" class="properties"></aside>
      <div class="drop-hint">Drop a .bpmn file to open it</div>
    </section>

    <section class="bottom">
      <nav class="tabs">
        <button type="button" data-tab="xml">Exported XML</button>
        <button type="button" data-tab="problems">Problems <span id="problem-count"></span></button>
        <button type="button" id="import-xml" class="tab-action">Import XML from editor</button>
      </nav>

      <textarea id="xml" class="pane" data-pane="xml" spellcheck="false" aria-label="Exported XML"></textarea>
      <div id="problems" class="pane problems" data-pane="problems"></div>
    </section>
  </main>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
